# compact_osrs_v1 reference map: a 128x128 island overworld and a 192x64 dungeon, built from b237
# cache content (SPEC.md, "World layout and renewable resources"). Coordinates are tiles relative
# to the named area's south-west corner (area defaults to "surface"); [[stamp]] sources are
# real-world b237 tiles. Spawn counts follow the spec's shared budgets.
#
# The island is one village and its countryside: Rimmington's houses around the well with the
# Draynor bank, the Lumbridge church, general store and smithy on the square's north side; Fred's
# farm and a cow pasture to the south; a river with a wooden bridge to the woods in the north; the
# Rimmington mine on the hill east of the village; and a dark, dangerous east with the outer
# resources, a lobster pier and the second way underground. The dungeon is the Varrock sewers and
# the moss cave joined to them, gated into branches, with Scurrius' lair at the far east end.

[map]
name = "compact_v1"
seed = 7
start = [26, 69]

[[area]]
name = "surface"
kind = "island"
origin = [2, 2]    # world tiles 128..255
size = [2, 2]
ocean_ring = 1

[[area]]
name = "dungeon"
kind = "void"
origin = [8, 2]    # world tiles 512..703 x 128..191
size = [3, 1]
fill_underlay = 63                 # solid rock round the tunnels, one dark mass
fill_height = 30

[materials]
sand = { underlay = 62 }
road = { overlay = 10 }
planks = { overlay = 5 }
dirt_path = { overlay = 22 }
river = { underlay = 48, overlay = 6, settings = 1 }
shallow = { underlay = 48, overlay = 442, settings = 1 }
water_mid = { underlay = 48, overlay = 445, settings = 1 }
water_deep = { underlay = 48, overlay = 448, settings = 1 }
ocean = { underlay = 48, overlay = 451, settings = 1 }
void = { settings = 1 }

[island]
coast = "smooth"
radius = 59
squareness = 3.2
wobble = 0.03
coast_noise = 2.5
beach_width = 3
sand_underlay = 62
grass = [[48, 35], [50, 22], [63, 15], [49, 14], [64, 8], [65, 6]]
sea_height = 0
ramp_tiles = 10
height_scale = 0.35
water_depths = [[2, "shallow"], [4, "water_mid"], [8, "water_deep"], [999, "ocean"]]

