# compact_osrs_v1 Scurrius encounter parameters (SPEC.md, "Scurrius as the shared advanced
# encounter"). Mechanics follow the OSRS fight; numbers are the mode's provisional tuning.

[boss]
npc = 7222                      # Scurrius (b237 cache; size 3, the private-instance variant)
minion = 7223                   # Giant rat (Scurrius' minion)
hp = 240                        # base maximum HP for one participant
group_scale_pct = 75            # +75% of base maximum HP per extra participant
max_hit = 8                     # melee, ranged and magic, before protection prayers
attack_speed = 4                # ticks between attacks (canonical cadence)
final_attack_speed = 3          # below the final phase threshold (canonical speed-up)
attack = 40                     # attack, ranged and magic levels
defence = 40
magic = 40
defence_bonus = [20, 20, 20, 20, 20]   # stab, slash, crush, ranged, magic
hazard_max_hit = 6              # falling bricks
hazard_warning_ticks = 3        # shadow shown before the bricks land
hazard_interval = 12            # ticks between falling-brick volleys
minion_hp = 10
minion_max_hit = 2
minion_attack_speed = 4
minions_per_summon = 3
max_minions = 8
summon_interval = 30            # ticks between rat summons (phase 2 and later)
feed_heal = 12                  # HP restored per feeding (scaled to the 240 HP budget)
feed_ticks = 6                  # ticks spent eating at a food pile
feed_interval = 40              # ticks between feedings in phase 2
phase2_pct = 80                 # melee only above this; feeds once on crossing it
phase3_pct = 30                 # moves to the centre; faster attacks, three-brick volleys
respawn_ticks = 100             # after a completed kill
reset_ticks = 50                # abandoned: no living player in the arena for this long
qualify_pct = 5                 # share of total actual player damage needed for kill credit

[arena]                         # dungeon-area tiles (maps/compact_v1.toml)
rect = [44, 45, 59, 60]         # inside the lair walls
centre = [51, 52]
spawn = [51, 52]
food_piles = [[51, 43], [51, 61], [60, 53]]   # the lair's three food piles

[loot]
always = [["Coins", 150, 150]]
bundle = [["Mithril ore", 3], ["Chaos rune", 12], ["Feather", 40]]   # one, equally likely
extra = [["Scurrius' spine", 1, 3], ["Prayer potion(4)", 1, 5]]       # [item, quantity, 1-in-N]
