  ["Thick Skin", 1], ["Burst of Strength", 1], ["Clarity of Thought", 1], ["Sharp Eye", 1], ["Mystic Will", 1],
  ["Rock Skin", 15], ["Superhuman Strength", 15], ["Improved Reflexes", 15], ["Hawk Eye", 15], ["Mystic Lore", 15],
