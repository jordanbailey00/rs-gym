[base]
env_name = rs_gym_compact
checkpoint_interval = 50
eval_episodes = 1000
seed = 1

# RS-gym compact_osrs_v1, schema compact-v2. profile: free_play, solo_boss, development,
# coop_boss. horizon = 0 keeps the mode's 12000 ticks. public_map = 1 adds landmark bearings.
# record = path writes each episode's actions for rc-viewer --replay.
[env]
num_agents = 1
profile = solo_boss
horizon = 0
public_map = 1

[vec]
total_agents = 1024
num_buffers = 2
num_threads = 16

[train]
gpus = 1
total_timesteps = 1_000_000_000
learning_rate = 0.0003
ent_coef = 0.01
gamma = 0.999
gae_lambda = 0.95
