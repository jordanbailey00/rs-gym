[base]
env_name = rs_gym
checkpoint_interval = 50
eval_episodes = 1000
seed = 1

# RS-gym world and task. task: total, combat, woodcutting, mining, fishing, cooking,
# smithing, wealth, kbd, chaos_elemental. episode_ticks = 0 keeps the task's length.
# record = path writes each episode's actions for rc-viewer --replay.
[env]
num_agents = 4
task = woodcutting
episode_ticks = 0

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[train]
gpus = 1
total_timesteps = 200_000_000
learning_rate = 0.0005
ent_coef = 0.001
gamma = 0.995
gae_lambda = 0.95
