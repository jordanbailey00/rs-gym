  ["Wind Strike", 1, 4], ["Water Strike", 1, 4],
  ["Wind Bolt", 15, 10], ["Water Bolt", 15, 10],
  ["Wind Blast", 30, 14], ["Water Blast", 30, 14],
]

[prayer]
# Enabled prayers by level; all others are unavailable in this mode.
