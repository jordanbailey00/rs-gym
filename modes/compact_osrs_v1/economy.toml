[[shop]]
name = "Aubury's Rune Shop"
npc = 11434                     # Aubury (Talk-to, Trade)
buys = "stock"                  # only what it sells
items = [
  ["Air rune", 1, 500, 25, 20], ["Water rune", 1, 500, 25, 20], ["Mind rune", 1, 500, 25, 20],
  ["Chaos rune", 4, 200, 10, 20], ["Death rune", 8, 100, 5, 20],
  ["Staff of air", 150, 8, 1, 100], ["Blue wizard hat", 50, 8, 1, 100], ["Blue wizard robe", 100, 8, 1, 100],
]

# Ellis tans one cowhide per item for a coin fee (Trade opens the tanning menu).
[tanner]
npc = 3231
rows = [["Cowhide", "Leather", 1], ["Cowhide", "Hard leather", 3]]

# Historian Aldo makes the bone weapons from the same consumed ingredients plus a fee, without the
# creation-skill requirement and without creation XP; he supplies the tools and station.
[aldo]
npc = 7615                      # Historian Aldo (Talk-to, Trade)
fee = 100
outputs = ["Bone mace", "Bone shortbow", "Bone staff"]

[sale]
buyback_pct = 40                # shop goods sell back at 40% of the purchase price, rounded down
# Explicit unit values for raw materials and products the shops do not sell.
values = [
  ["Copper ore", 2], ["Tin ore", 2], ["Iron ore", 4], ["Coal", 3], ["Mithril ore", 10],
  ["Bronze bar", 8], ["Steel bar", 20], ["Mithril bar", 50],
  ["Logs", 2], ["Oak logs", 5], ["Willow logs", 10],
  ["Flax", 1], ["Bow string", 3], ["Cowhide", 3], ["Leather", 4], ["Hard leather", 6], ["Pure essence", 1],
  ["Bronze dagger", 4],
  ["Shortbow (u)", 6], ["Oak shortbow (u)", 30], ["Willow shortbow (u)", 100], ["Steel studs", 10],
  ["Raw shrimps", 1], ["Raw trout", 3], ["Raw lobster", 8], ["Raw beef", 1], ["Raw chicken", 1],
  ["Cooked meat", 1], ["Cooked chicken", 1], ["Bones", 1], ["Big bones", 4],
  ["Prayer potion(3)", 72], ["Prayer potion(2)", 48], ["Prayer potion(1)", 24],
]
# Explicitly worthless (shops refuse them; players may drop them).
zero = [
  "Vial", "Burnt shrimp", "Burnt meat", "Burnt chicken", 343, "Burnt lobster", "Arrow shaft", "Headless arrow",
  "Bronze arrowtips", "Steel arrowtips", "Mithril arrowtips", "Scurrius' spine", "Bone mace", "Bone shortbow",
  "Bone staff", "Coins",
]
