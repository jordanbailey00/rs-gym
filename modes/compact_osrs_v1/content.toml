# compact_osrs_v1 content: everything the mode enables and every value it changes.
# Requirements are rebased to the bands 1 / 15 / 30 (mode.toml); `canonical` notes the inherited
# value where the rule needs it (success curves are shifted by canonical - mode level).

# Names that map to several cache ids.
