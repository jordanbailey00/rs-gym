# compact_osrs_v1 reference map: a 128x128 island overworld and a 64x64 dungeon, built from b237
# cache content (SPEC.md, "World layout and renewable resources"). Coordinates are tiles relative
# to the named area's south-west corner (area defaults to "surface"); [[stamp]] sources are
# real-world b237 tiles. Spawn counts follow the spec's shared budgets.

[map]
name = "compact_v1"
seed = 7
start = [66, 52]

[[area]]
name = "surface"
kind = "island"
origin = [2, 2]    # world tiles 128..255
size = [2, 2]
ocean_ring = 1

[[area]]
name = "dungeon"
kind = "void"
origin = [8, 2]    # world tiles 512..575 x 128..191
size = [1, 1]

[materials]
grass = { underlay = 48 }
grass_alt = { underlay = 50 }
sand = { underlay = 48, overlay = 22 }
path = { overlay = 10 }
dirt = { underlay = 64 }
river = { underlay = 48, overlay = 6, settings = 1 }
shallow = { underlay = 48, overlay = 442, settings = 1 }
water_mid = { underlay = 48, overlay = 445, settings = 1 }
water_deep = { underlay = 48, overlay = 448, settings = 1 }
ocean = { underlay = 48, overlay = 451, settings = 1 }
void = { settings = 1 }

[island]
radius = 58
wobble = 0.07
beach_width = 3
sea_height = 0
ramp_tiles = 10
height_scale = 0.35
water_depths = [[2, "shallow"], [4, "water_mid"], [8, "water_deep"], [999, "ocean"]]

# Quarry and outer-area ground.
[[paint]]
rect = [78, 84, 96, 102]
material = "dirt"
alt = "grass"

[[paint]]
rect = [94, 88, 116, 114]
material = "dirt"
alt = "grass_alt"

# A river from an inland spring west to the coast, between the farm and the willows.
[[river]]
points = [[42, 104], [30, 98], [16, 92], [0, 90]]
width = 5
material = "river"

# Paths: the town street, then out to every region.
[[path]]
