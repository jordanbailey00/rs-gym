# Gym v1: a dense 192x192 island plus a dungeon, built from b237 cache content.
# Coordinates are tiles relative to the named area's south-west corner (area defaults to "surface").
# Source coordinates in [[stamp]] are real-world b237 tiles.

[map]
name = "gym_v1"
seed = 1
start = [94, 94]

[[area]]
name = "surface"
kind = "island"
origin = [2, 2]    # south-west mapsquare; the real world starts at mapsquare x 15, y 19
size = [3, 3]      # 192x192 tiles, world tiles 128..319
ocean_ring = 1     # all-water mapsquares around the island

[[area]]
name = "dungeon"
kind = "void"
origin = [8, 2]    # world tiles 512..639 x 128..255
size = [2, 2]

# Floor ids sampled from real tiles (map floor ids, as stored in mapsquare terrain).
[materials]
grass = { underlay = 48 }                                    # Tutorial Island / Lumbridge grass
grass_alt = { underlay = 50 }
sand = { underlay = 48, overlay = 22 }                       # Tutorial Island beach
path = { overlay = 10 }                                      # Lumbridge stone path
wild = { underlay = 145 }                                    # wilderness ground (north of Edgeville)
wild_alt = { underlay = 64 }
river = { underlay = 48, overlay = 6, settings = 1 }         # River Lum water, blocked
# Sea overlays as found off Tutorial Island; settings = 1 blocks the tile.
shallow = { underlay = 48, overlay = 442, settings = 1 }
water_mid = { underlay = 48, overlay = 445, settings = 1 }
water_deep = { underlay = 48, overlay = 448, settings = 1 }
ocean = { underlay = 48, overlay = 451, settings = 1 }
void = { settings = 1 }                                      # no floor, blocked (dungeon rock)

[island]
radius = 80
wobble = 0.08
beach_width = 3
sea_height = 0
ramp_tiles = 12
height_scale = 0.4
water_depths = [[2, "shallow"], [4, "water_mid"], [8, "water_deep"], [999, "ocean"]]

# Wilderness floor on the north of the island.
[[paint]]
rect = [0, 132, 192, 192]
material = "wild"
alt = "wild_alt"

# A river from an inland spring to the east coast; the Lumbridge bridge crosses it at x 150.
[[river]]
points = [[126, 124], [146, 124], [160, 124], [192, 116]]
width = 15
material = "river"

