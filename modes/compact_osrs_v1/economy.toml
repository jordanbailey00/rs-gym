# compact_osrs_v1 economy: fixed-price shops, services and sale values (SPEC.md, "Shops, prices and
# economic invariants"). Prices are mode defaults, unrelated to Grand Exchange prices.
#
# Shop rows: [item, price, stock cap, restock quantity, restock ticks]. Stock starts at the cap and
# regenerates on world ticks. Player sales pay the item's sale value and remove the item; they never
# add stock.

[[shop]]
name = "General Store"
npc = 2813                      # Shop keeper
buys = "valued"                 # any item with a sale value above zero
items = [
  ["Hammer", 1, 16, 1, 10], ["Knife", 1, 16, 1, 10], ["Chisel", 1, 16, 1, 10], ["Needle", 1, 16, 1, 10],
  ["Small fishing net", 1, 16, 1, 10], ["Fly fishing rod", 1, 16, 1, 10], ["Lobster pot", 1, 16, 1, 10],
  ["Thread", 1, 500, 25, 20], ["Feather", 1, 500, 25, 20],
  ["Bronze axe", 10, 8, 1, 100], ["Steel axe", 50, 8, 1, 100], ["Mithril axe", 150, 8, 1, 100],
  ["Bronze pickaxe", 10, 8, 1, 100], ["Steel pickaxe", 50, 8, 1, 100], ["Mithril pickaxe", 150, 8, 1, 100],
  ["Bronze scimitar", 30, 4, 1, 200], ["Steel scimitar", 150, 4, 1, 200], ["Mithril scimitar", 450, 4, 1, 200],
  ["Bronze mace", 30, 4, 1, 200], ["Steel mace", 150, 4, 1, 200], ["Mithril mace", 450, 4, 1, 200],
  ["Bronze full helm", 20, 4, 1, 200], ["Steel full helm", 100, 4, 1, 200], ["Mithril full helm", 300, 4, 1, 200],
  ["Bronze platebody", 60, 4, 1, 200], ["Steel platebody", 300, 4, 1, 200], ["Mithril platebody", 900, 4, 1, 200],
  ["Bronze platelegs", 40, 4, 1, 200], ["Steel platelegs", 200, 4, 1, 200], ["Mithril platelegs", 600, 4, 1, 200],
  ["Bronze kiteshield", 40, 4, 1, 200], ["Steel kiteshield", 200, 4, 1, 200], ["Mithril kiteshield", 600, 4, 1, 200],
  ["Shortbow", 30, 4, 1, 200], ["Oak shortbow", 150, 4, 1, 200], ["Willow shortbow", 450, 4, 1, 200],
  ["Leather body", 50, 4, 1, 200], ["Hardleather body", 200, 4, 1, 200], ["Studded body", 600, 4, 1, 200],
