# ---- Equipment use requirements (replace the inherited ones) ----------------------------------

[[equip]]
band = 1
attack = ["Bronze dagger", "Bronze scimitar", "Bronze mace", "Bronze axe", "Bronze pickaxe"]
defence = ["Bronze full helm", "Bronze platebody", "Bronze platelegs", "Bronze kiteshield"]
ranged = ["Shortbow", "Bronze arrow", "Leather body", "Leather chaps", "Leather cowl"]
magic = ["Staff of air", "Blue wizard hat", "Blue wizard robe"]

[[equip]]
band = 15
attack = ["Steel scimitar", "Steel mace", "Steel axe", "Steel pickaxe"]
defence = ["Steel full helm", "Steel platebody", "Steel platelegs", "Steel kiteshield", "Hardleather body"]
ranged = ["Oak shortbow", "Steel arrow", "Hardleather body"]

[[equip]]
band = 30
attack = ["Mithril scimitar", "Mithril mace", "Mithril axe", "Mithril pickaxe", "Bone mace"]
defence = ["Mithril full helm", "Mithril platebody", "Mithril platelegs", "Mithril kiteshield", "Studded body"]
ranged = ["Willow shortbow", "Mithril arrow", "Studded body", "Studded chaps", "Bone shortbow"]
magic = ["Bone staff"]

# Bone weapons start from their mode precursor's bonuses, with +2 max hit against rats.
[[bone_weapon]]
item = "Bone mace"
bonuses_from = "Mithril mace"
rat_max_hit = 2

[[bone_weapon]]
item = "Bone shortbow"
bonuses_from = "Willow shortbow"
rat_max_hit = 2

[[bone_weapon]]
item = "Bone staff"
bonuses_from = "Staff of air"
rat_max_hit = 2
powered_max_hit = 14        # fixed base max hit of its powered spell, independent of Magic level
attack_speed = 4
charge = "Chaos rune"       # one charge per rune; the recipe's 100 runes become 100 charges
# rat-type enemies: the mode's giant rats, Scurrius and its minions

