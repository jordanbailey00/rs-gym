width = 3

[[path]]
points = [[66, 14], [66, 100]]
width = 3

[[path]]
points = [[66, 78], [86, 92], [104, 104]]
width = 2

[[path]]
points = [[66, 26], [88, 22]]
width = 2

[[path]]
points = [[86, 52], [102, 42]]
width = 2

[[path]]
points = [[34, 52], [24, 32]]
width = 2

